<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - LoRa Home Gateway</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <header>
      <div>
        <h1 data-i18n="gw_title">LoRa Home Gateway</h1>
        <div class="header-status-bar">
          <span class="status-pill" id="gw-nodes-pill"><span class="pill-dot"></span>-- Nodes</span>
          <span class="status-pill" id="gw-uptime-pill">Up: --</span>
          <span class="status-pill" id="gw-wifi-pill">WiFi: --</span>
          <span class="status-pill" id="gw-reset-pill">Boot: --</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="lang-toggle" class="btn-lang-toggle" title="Switch Language" onclick="toggleLanguage()">🇫🇷 FR</button>
        <button id="theme-toggle" class="btn-theme-toggle" title="Toggle Light/Dark Mode" onclick="toggleTheme()">☀️</button>
        <a href="/admin" class="btn" data-i18n="btn_admin">Administration →</a>
      </div>
    </header>

    <!-- Dashboard -->
    <div id="tab-dashboard" class="tab-content active">

      <div class="grid" id="nodes-container">
        <div class="stat-card scanning-card">
          <div class="radio-scanner">
            <svg class="radio-tower-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path class="wave wave-1" d="M16.24 7.76a6 6 0 0 1 0 8.49"/>
              <path class="wave wave-2" d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
              <path class="wave wave-1" d="M7.76 16.24a6 6 0 0 1 0-8.49"/>
              <path class="wave wave-2" d="M4.93 19.07a10 10 0 0 1 0-14.14"/>
              <line x1="12" y1="12" x2="12" y2="21"/>
              <circle cx="12" cy="12" r="2"/>
            </svg>
          </div>
          <div class="scanning-text" data-i18n="searching">
            Searching for LoRa signals
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const translations = {
      en: {
        gw_title: "LoRa Home Gateway",
        btn_metrics: "Prometheus Metrics",
        btn_admin: "Administration →",
        searching: "Searching for LoRa signals",
        up: "Up",
        boot: "Boot",
        nodes: "Nodes",
        no_sensors: "No active sensors",
        rssi_strong: "Strong",
        rssi_medium: "Medium",
        rssi_weak: "Weak",
        snr_clean: "Clean",
        snr_noisy: "Noisy",
        snr_poor: "Poor",
        lost: "Lost",
        reboots: "Rbts",
        seen: "Seen",
        ago: "ago",
        sensor_humidity: "Humidity",
        sensor_pressure: "Pressure",
        sensor_light: "Light",
        sensor_battery: "Battery",
        sensor_sensor: "Sensor",
        hum_dry: "Dry",
        hum_optimal: "Optimal",
        hum_humid: "Humid",
        press_sunny: "Sunny",
        press_rainy: "Rainy",
        press_variable: "Variable",
        press_stable: "STABLE",
        press_rising: "RISING",
        press_falling: "FALLING",
        press_trend_suffix: "(3H TREND)",
        light_night: "Night",
        light_indoor: "Indoor",
        light_bright: "Bright",
        light_sunlight: "Sunlight",
        batt_charging: "CHARGING",
        batt_discharging: "DISCHARGING",
        batt_idle: "IDLE",
        co2_good: "Clean Air",
        co2_moderate: "Moderate",
        co2_ventilate: "Ventilate!",
        co2_poor: "Stale Air",
        confirm_reset_stats: "Reset stats and reboot counter for node {id}?",
        reset_stats_title: "Click to reset node statistics",
        node_subtitle: "LoRa Node #{id}"
      },
      fr: {
        gw_title: "Passerelle LoRa",
        btn_metrics: "Métriques Prometheus",
        btn_admin: "Administration →",
        searching: "Recherche de signaux LoRa...",
        up: "En service",
        boot: "Démarrage",
        nodes: "Nœuds",
        no_sensors: "Aucun capteur actif",
        rssi_strong: "Fort",
        rssi_medium: "Moyen",
        rssi_weak: "Faible",
        snr_clean: "Propre",
        snr_noisy: "Bruité",
        snr_poor: "Mauvais",
        lost: "Perdus",
        reboots: "Redémarrage",
        seen: "Vu",
        ago: "il y a",
        sensor_humidity: "Humidité",
        sensor_pressure: "Pression",
        sensor_light: "Luminosité",
        sensor_battery: "Batterie",
        sensor_sensor: "Capteur",
        hum_dry: "Sec",
        hum_optimal: "Optimal",
        hum_humid: "Humide",
        press_sunny: "Ensoleillé",
        press_rainy: "Pluvieux",
        press_variable: "Variable",
        press_stable: "STABLE",
        press_rising: "EN HAUSSE",
        press_falling: "EN BAISSE",
        press_trend_suffix: "(TENDANCE 3H)",
        light_night: "Nuit",
        light_indoor: "Intérieur",
        light_bright: "Plein jour",
        light_sunlight: "Plein soleil",
        batt_charging: "CHARGE",
        batt_discharging: "DÉCHARGE",
        batt_idle: "REPOS",
        co2_good: "Air Pur",
        co2_moderate: "Modéré",
        co2_ventilate: "Aérer !",
        co2_poor: "Air Vicié",
        confirm_reset_stats: "Réinitialiser les statistiques et le compteur pour le nœud {id} ?",
        reset_stats_title: "Cliquer pour réinitialiser les statistiques du nœud",
        node_subtitle: "Nœud LoRa #{id}"
      }
    };

    let currentLang = localStorage.getItem('lang') || (navigator.language && navigator.language.startsWith('fr') ? 'fr' : 'en');

    function t(key, params = {}) {
      const dict = translations[currentLang] || translations.en;
      let text = dict[key] || translations.en[key] || key;
      for (const [k, v] of Object.entries(params)) {
        text = text.replace(`{${k}}`, v);
      }
      return text;
    }

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      document.documentElement.setAttribute('lang', lang);
      
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.innerText = t(key);
      });
      
      const btn = document.getElementById('lang-toggle');
      if (btn) btn.innerText = currentLang === 'fr' ? '🇫🇷 FR' : '🇬🇧 EN';

      updateData();
    }

    function toggleLanguage() {
      setLanguage(currentLang === 'fr' ? 'en' : 'fr');
    }

    const nodesContainer = document.getElementById('nodes-container');

    const getRssiIcon = (rssi) => {
      let color = '#ef4444';
      let activeBars = 1;
      if (rssi >= -80) {
        color = '#10b981';
        activeBars = 3;
      } else if (rssi >= -105) {
        color = '#f59e0b';
        activeBars = 2;
      }
      return `
        <svg class="node-radio-icon" style="color: ${color};" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 20v-4" style="opacity: ${activeBars >= 1 ? 1 : 0.3}" />
          <path d="M12 20v-8" style="opacity: ${activeBars >= 2 ? 1 : 0.3}" />
          <path d="M18 20V4" style="opacity: ${activeBars >= 3 ? 1 : 0.3}" />
        </svg>`;
    };

    const getSnrIcon = (snr) => {
      let color = '#64748b';
      if (snr !== undefined) {
        if (snr >= 7) color = '#10b981';
        else if (snr >= 0) color = '#f59e0b';
        else color = '#ef4444';
      }
      return `
        <svg class="node-radio-icon" style="color: ${color};" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 10h3l2.5-6 3.5 12 2.5-9 2.5 7h3l2.5-4 1.5 2h2" />
        </svg>`;
    };

    const getRssiLabelClass = (rssi) => {
      if (rssi >= -80) return 'strong';
      if (rssi >= -105) return 'medium';
      return 'weak';
    };

    const getRssiLabelText = (rssi) => {
      if (rssi >= -80) return t('rssi_strong');
      if (rssi >= -105) return t('rssi_medium');
      return t('rssi_weak');
    };

    const getSnrLabelClass = (snr) => {
      if (snr === undefined) return 'poor';
      if (snr >= 7) return 'clean';
      if (snr >= 0) return 'noisy';
      return 'poor';
    };

    const getSnrLabelText = (snr) => {
      if (snr === undefined) return '--';
      if (snr >= 7) return t('snr_clean');
      if (snr >= 0) return t('snr_noisy');
      return t('snr_poor');
    };
    const getResetReasonLabel = (reason) => {
      switch (reason) {
        case 1: return 'PowerOn';
        case 2: return 'ExtPin';
        case 3: return 'Software';
        case 4: return 'Panic';
        case 5: return 'IntWDT';
        case 6: return 'TaskWDT';
        case 7: return 'WDT';
        case 8: return 'DeepSleep';
        case 9: return 'Brownout';
        case 10: return 'SDIO';
        default: return 'Unknown';
      }
    };

    const getResetReasonColor = (reason) => {
      switch (reason) {
        case 1: // PowerOn
        case 8: // DeepSleep
          return '#38bdf8'; // Sky Blue
        case 3: // Software
          return '#c084fc'; // Purple
        case 2: // ExtPin
          return '#fbbf24'; // Amber
        case 4: // Panic
        case 5: // IntWDT
        case 6: // TaskWDT
        case 7: // WDT
        case 9: // Brownout
          return '#f87171'; // Red
        default:
          return '#94a3b8';
      }
    };
    const formatUptime = (seconds) => {
      const d = Math.floor(seconds / (3600 * 24));
      const h = Math.floor((seconds % (3600 * 24)) / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      const dayUnit = currentLang === 'fr' ? 'j' : 'd';
      let res = '';
      if (d > 0) res += d + dayUnit + ' ';
      if (h > 0 || d > 0) res += h + 'h ';
      if (m > 0 || h > 0 || d > 0) res += m + 'm ';
      res += s + 's';
      return res;
    };

    const updateData = async () => {
      try {
        const response = await fetch('/api/nodes');
        const data = await response.json();

        // Header Status Pills
        if (data.gateway && data.gateway.uptime_sec !== undefined) {
          const uptimeEl = document.getElementById('gw-uptime-pill');
          if (uptimeEl) uptimeEl.innerText = `${t('up')}: ${formatUptime(data.gateway.uptime_sec)}`;

          const wifiEl = document.getElementById('gw-wifi-pill');
          if (wifiEl) wifiEl.innerText = 'WiFi: ' + data.gateway.wifi_rssi + ' dBm';

          const resetEl = document.getElementById('gw-reset-pill');
          if (resetEl && data.gateway.reset_reason !== undefined) {
            const reasonLabel = getResetReasonLabel(data.gateway.reset_reason);
            const reasonColor = getResetReasonColor(data.gateway.reset_reason);
            resetEl.innerHTML = `${t('boot')}: <span style="color:${reasonColor}; font-weight:700; margin-left:3px;">${reasonLabel}</span>`;
          }
        }

        const onlineCount = data.nodes ? data.nodes.filter(n => n.elapsed_sec < (n.tx_interval || 60) * 2.5).length : 0;
        const totalCount = data.nodes ? data.nodes.length : 0;
        const nodesEl = document.getElementById('gw-nodes-pill');
        if (nodesEl) {
          const dotColor = onlineCount > 0 ? '#10b981' : '#ef4444';
          nodesEl.innerHTML = `<span class="pill-dot" style="background:${dotColor}; box-shadow:0 0 8px ${dotColor}"></span>${onlineCount}/${totalCount} ${t('nodes')}`;
        }

        if (!data.nodes || data.nodes.length === 0) {
          nodesContainer.innerHTML = `
            <div class="stat-card scanning-card">
              <div class="radio-scanner">
                <svg class="radio-tower-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path class="wave wave-1" d="M16.24 7.76a6 6 0 0 1 0 8.49"/>
                  <path class="wave wave-2" d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                  <path class="wave wave-1" d="M7.76 16.24a6 6 0 0 1 0-8.49"/>
                  <path class="wave wave-2" d="M4.93 19.07a10 10 0 0 1 0-14.14"/>
                  <line x1="12" y1="12" x2="12" y2="21"/>
                  <circle cx="12" cy="12" r="2"/>
                </svg>
              </div>
              <div class="scanning-text" data-i18n="searching">
                ${t('searching')}
              </div>
            </div>`;
          return;
        }

        // Remove scanning indicator if nodes are present
        const scanningCard = nodesContainer.querySelector('.scanning-card');
        if (scanningCard) {
          nodesContainer.innerHTML = '';
        }

        const themes = [
          { // Violet
            primary: '#a78bfa',
            border: 'rgba(139, 92, 246, 0.35)',
            hoverBorder: 'rgba(139, 92, 246, 0.65)',
            glow: 'rgba(139, 92, 246, 0.25)',
            badgeBg: 'rgba(139, 92, 246, 0.15)',
            badgeText: '#c084fc',
            badgeBorder: 'rgba(139, 92, 246, 0.4)'
          },
          { // Sky Blue
            primary: '#38bdf8',
            border: 'rgba(14, 165, 233, 0.35)',
            hoverBorder: 'rgba(14, 165, 233, 0.65)',
            glow: 'rgba(14, 165, 233, 0.25)',
            badgeBg: 'rgba(14, 165, 233, 0.15)',
            badgeText: '#38bdf8',
            badgeBorder: 'rgba(14, 165, 233, 0.4)'
          },
          { // Amber
            primary: '#fbbf24',
            border: 'rgba(245, 158, 11, 0.35)',
            hoverBorder: 'rgba(245, 158, 11, 0.65)',
            glow: 'rgba(245, 158, 11, 0.25)',
            badgeBg: 'rgba(245, 158, 11, 0.15)',
            badgeText: '#fbbf24',
            badgeBorder: 'rgba(245, 158, 11, 0.4)'
          },
          { // Emerald
            primary: '#34d399',
            border: 'rgba(16, 185, 129, 0.35)',
            hoverBorder: 'rgba(16, 185, 129, 0.65)',
            glow: 'rgba(16, 185, 129, 0.25)',
            badgeBg: 'rgba(16, 185, 129, 0.15)',
            badgeText: '#34d399',
            badgeBorder: 'rgba(16, 185, 129, 0.4)'
          },
          { // Rose
            primary: '#fb7185',
            border: 'rgba(244, 63, 94, 0.35)',
            hoverBorder: 'rgba(244, 63, 94, 0.65)',
            glow: 'rgba(244, 63, 94, 0.25)',
            badgeBg: 'rgba(244, 63, 94, 0.15)',
            badgeText: '#fb7185',
            badgeBorder: 'rgba(244, 63, 94, 0.4)'
          }
        ];

        data.nodes.forEach(node => {
          // Dynamic timeouts based on node's configured tx_interval (in seconds)
          const interval = node.tx_interval || 60;
          const offlineThreshold = interval * 2.5;
          const hideThreshold = interval * 5;

          const cardId = `node-card-${node.id}`;
          let existingCard = document.getElementById(cardId);

          if (node.elapsed_sec >= hideThreshold) {
            if (existingCard) existingCard.remove();
            return;
          }

          const isOnline = node.elapsed_sec < offlineThreshold;
          const statusClass = isOnline ? '' : 'offline';
          const lastSeenText = currentLang === 'fr'
            ? `${t('seen')} ${t('ago')} ${isOnline ? node.elapsed_sec + 's' : formatUptime(node.elapsed_sec)}`
            : `${t('seen')} ${isOnline ? node.elapsed_sec + 's' : formatUptime(node.elapsed_sec)} ${t('ago')}`;

          let dotClass = '';
          if (node.elapsed_sec < interval * 1.2) {
            dotClass = ''; // green
          } else if (node.elapsed_sec < offlineThreshold) {
            dotClass = 'warning'; // orange
          } else {
            dotClass = 'offline'; // red
          }

          const theme = themes[(node.id || 0) % themes.length];

          let readingsHtml = '';
          if (node.readings && node.readings.length > 0) {
            node.readings.forEach(r => {
              let label = r.label || r.name || t('sensor_sensor');
              let value = r.value;
              let unit = r.unit || '';
              let iconClass = 'temp';
              let iconSvg = '<path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>';

              let subLabel = '';
              const nameLower = (r.name || '').toLowerCase();
              if (nameLower.includes('power') || nameLower.includes('watt')) {
                return;
              }

              if (nameLower.includes('temp')) {
                let rawTemp = typeof value === 'number' ? value : parseFloat(value);
                if (rawTemp < 18.0) iconClass = 'hum';
                else if (rawTemp <= 24.0) iconClass = 'co2';
                else if (rawTemp <= 28.0) iconClass = 'light';
                else iconClass = 'temp';
              } else if (nameLower.includes('humidity')) {
                let rawHum = typeof value === 'number' ? value : parseFloat(value);
                unit = '';
                label = t('sensor_humidity');
                subLabel = `<span style="font-size: 9px; opacity: 0.75; text-transform: lowercase; margin-left: 3px;">(${rawHum.toFixed(1)}%)</span>`;
                iconSvg = '<path d="M12 22a7 7 0 0 0 7-7c0-4.3-7-11-7-11S5 10.7 5 15a7 7 0 0 0 7 7z"/>';
                if (rawHum < 35.0) {
                  iconClass = 'light';
                  value = t('hum_dry');
                } else if (rawHum <= 60.0) {
                  iconClass = 'co2';
                  value = t('hum_optimal');
                } else {
                  iconClass = 'hum';
                  value = t('hum_humid');
                }
              } else if (nameLower.includes('pressure')) {
                let rawP = typeof value === 'number' ? value : parseFloat(value);
                let altM = getStationAltitude();
                let seaP = rawP * Math.pow(1 - (0.0065 * altM) / 288.15, -5.255);
                unit = '';
                label = t('sensor_pressure');
                let trendInfo = getBarometricTrend(node.id, rawP);
                
                let trendText = `${t('press_stable')} ➔ ${t('press_trend_suffix')}`;
                if (trendInfo.hours > 0.05) {
                  let sign = trendInfo.diff >= 0 ? '+' : '';
                  let hStr = trendInfo.hours >= 1 ? `${Math.round(trendInfo.hours)}h` : `${Math.round(trendInfo.hours * 60)}m`;
                  trendText = `${trendInfo.label} ${trendInfo.arrow} (${sign}${trendInfo.diff.toFixed(1)}hPa / ${hStr})`;
                }

                subLabel = `<span style="font-size: 9px; opacity: 0.75; text-transform: lowercase; margin-left: 3px;">(${seaP.toFixed(1)}hpa qnh)</span><div style="font-size: 9px; opacity: 0.75; margin-top: 2px; text-transform: uppercase;">${trendText}</div>`;
                iconClass = 'press';
                iconSvg = '<circle cx="12" cy="12" r="9"/><polygon points="12 6 14.5 12 12 18 9.5 12 12 6"/><line x1="12" y1="3" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21"/><line x1="3" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21" y2="12"/>';

                if (seaP >= 1013.25 || (trendInfo.rate || 0) >= 0.5) {
                  value = t('press_sunny');
                } else if (seaP < 1000.0 || (trendInfo.rate || 0) <= -0.5) {
                  value = t('press_rainy');
                } else {
                  value = t('press_variable');
                }
              } else if (nameLower.includes('light') || nameLower.includes('lux')) {
                let rawLux = typeof value === 'number' ? Math.round(value) : parseInt(value);
                unit = '';
                label = t('sensor_light');
                subLabel = `<span style="font-size: 9px; opacity: 0.75; text-transform: lowercase; margin-left: 3px;">(${rawLux}lux)</span>`;
                iconSvg = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';
                if (rawLux < 15) {
                  iconClass = 'hum';
                  value = t('light_night');
                } else if (rawLux < 500) {
                  iconClass = 'light';
                  value = t('light_indoor');
                } else if (rawLux < 10000) {
                  iconClass = 'light';
                  value = t('light_bright');
                } else {
                  iconClass = 'co2';
                  value = t('light_sunlight');
                }
              } else if (nameLower.includes('voltage') || nameLower.includes('volt')) {
                iconClass = 'batt';
                iconSvg = '<rect x="2" y="7" width="16" height="10" rx="2" ry="2"/><line x1="22" y1="11" x2="22" y2="13"/>';
                let rawV = typeof value === 'number' ? value : parseFloat(value);
                let smoothV = smoothVoltage(node.id, rawV, node.packets_count);

                let currReading = node.readings.find(item => (item.name || '').toLowerCase().includes('current') || (item.name || '').toLowerCase().includes('amp'));
                let rawCurr = currReading !== undefined ? (typeof currReading.value === 'number' ? currReading.value : parseFloat(currReading.value)) : 0;
                let pct = voltageToLiIonPercent(smoothV, rawCurr);
                
                let currText = '';
                if (currReading !== undefined) {
                  let sign = rawCurr > 0 ? '+' : '';
                  let cStatus = rawCurr > 0.3 ? t('batt_charging') : (rawCurr < -0.3 ? t('batt_discharging') : t('batt_idle'));
                  currText = `<div style="font-size: 9px; opacity: 0.75; margin-top: 2px; text-transform: uppercase;">${cStatus} (${sign}${rawCurr.toFixed(2)}mA)</div>`;
                }

                subLabel = `<span style="font-size: 9px; opacity: 0.75; text-transform: lowercase; margin-left: 3px;">(${smoothV.toFixed(2)}V)</span>${currText}`;
                value = pct;
                unit = '%';
                label = t('sensor_battery');
              } else if (nameLower.includes('current') || nameLower.includes('amp')) {
                return;
              } else if (nameLower.includes('co2')) {
                let rawCo2 = typeof value === 'number' ? Math.round(value) : parseInt(value);
                unit = '';
                label = 'CO2';
                subLabel = `<span style="font-size: 9px; opacity: 0.75; text-transform: lowercase; margin-left: 3px;">(${rawCo2}ppm)</span>`;
                iconSvg = '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>';
                if (rawCo2 < 800) {
                  iconClass = 'co2';
                  value = t('co2_good');
                } else if (rawCo2 < 1000) {
                  iconClass = 'light';
                  value = t('co2_moderate');
                } else if (rawCo2 < 1500) {
                  iconClass = 'press';
                  value = t('co2_ventilate');
                } else {
                  iconClass = 'temp';
                  value = t('co2_poor');
                }
              }

              let displayVal = typeof value === 'number' ? (Number.isInteger(value) ? value : value.toFixed(1)) : value;

              readingsHtml += `
                <div class="metric-item">
                  <div class="metric-value-wrapper">
                    <svg class="metric-icon ${iconClass}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${iconSvg}</svg>
                    <span class="metric-value">${displayVal}<span class="metric-unit">${unit}</span></span>
                  </div>
                  <span class="metric-label">${label}${subLabel}</span>
                </div>`;
            });
          }

          const lostCount = node.packets_lost || 0;
          const totalPackets = (node.packets_count || 0) + lostCount;
          const lossPercent = totalPackets > 0 ? (lostCount * 100) / totalPackets : 0;
          const lossPercentStr = lossPercent.toFixed(1).replace('.', ',');

          let lossColor = '#34d399';
          if (lossPercent > 5) {
            lossColor = '#ef4444';
          } else if (lossPercent >= 1) {
            lossColor = '#fbbf24';
          }

          const cardInnerHtml = `
              <div class="node-header">
                <div class="node-title-group">
                  <span style="font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:#64748b; margin-bottom:2px;">${t('node_subtitle', { id: node.id })}</span>
                  <span class="node-name" style="color: ${isOnline ? theme.primary : '#94a3b8'}; text-shadow: 0 0 10px ${isOnline ? theme.glow : 'transparent'};">${node.name}</span>
                </div>
              </div>
              
              <div class="node-readings">
                ${readingsHtml || `<div style="flex:1; text-align:center; color:#64748b; font-size:13px; padding:12px;">${t('no_sensors')}</div>`}
              </div>

              <div class="node-footer">
                <div class="node-footer-left">
                  <div class="footer-metric">
                    ${getRssiIcon(node.rssi)}
                    RSSI: <b>${node.rssi} dBm</b> <span class="radio-badge rssi-${getRssiLabelClass(node.rssi)}">${getRssiLabelText(node.rssi)}</span>
                  </div>
                  <div class="footer-metric">
                    ${getSnrIcon(node.snr)}
                    SNR: <b>${node.snr !== undefined ? node.snr.toFixed(1) : '--'} dB</b> <span class="radio-badge snr-${getSnrLabelClass(node.snr)}">${getSnrLabelText(node.snr)}</span>
                  </div>
                </div>
                <div class="node-footer-right">
                  <div class="footer-metric right-aligned">
                    <span style="cursor:pointer;" title="${t('reset_stats_title')}" onclick="resetNodeStats(${node.id})">${t('lost')}: <b style="color: ${lossColor}">${lostCount} (${lossPercentStr} %)</b></span>
                    <span class="stat-divider">·</span>
                    <span style="cursor:pointer; display:inline-flex; align-items:center; gap:2px;" title="${t('reset_stats_title')}" onclick="resetNodeStats(${node.id})">
                      ${t('reboots')}: <b style="color: ${node.reboots > 0 ? '#fbbf24' : '#64748b'}">${node.reboots}</b>
                      <svg style="width:11px; height:11px; opacity:0.6; transition:transform 0.3s, opacity 0.2s; margin-left:2px; vertical-align:middle;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" onmouseover="this.style.opacity='1'; this.style.transform='rotate(180deg)';" onmouseout="this.style.opacity='0.6'; this.style.transform='rotate(0deg)';">
                        <path d="M23 4v6h-6"/>
                        <path d="M1 20v-6h6"/>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                      </svg>
                    </span>
                  </div>
                  <div class="status-indicator right-aligned">
                    <span class="dot ${dotClass}"></span>
                    <span>${lastSeenText} · ${t('boot')}: <span style="color: ${getResetReasonColor(node.last_reset_reason || 8)}; font-weight: 700;">${getResetReasonLabel(node.last_reset_reason || 8)}</span></span>
                  </div>
                </div>
              </div>`;

          if (existingCard) {
            existingCard.className = `node-card ${statusClass}`;
            existingCard.style.cssText = isOnline ? `--card-border: ${theme.border}; --card-border-hover: ${theme.hoverBorder}; --card-glow: ${theme.glow};` : '';
            if (existingCard.innerHTML !== cardInnerHtml) {
              existingCard.innerHTML = cardInnerHtml;
            }
          } else {
            const cardEl = document.createElement('div');
            cardEl.id = cardId;
            cardEl.className = `node-card ${statusClass}`;
            if (isOnline) {
              cardEl.style.cssText = `--card-border: ${theme.border}; --card-border-hover: ${theme.hoverBorder}; --card-glow: ${theme.glow};`;
            }
            cardEl.innerHTML = cardInnerHtml;
            nodesContainer.appendChild(cardEl);
          }
        });
      } catch (error) {
        console.error('Error fetching data:', error);
      }
    };

    function voltageToLiIonPercent(volts, current) {
      if (typeof volts !== 'number' || isNaN(volts)) return 0;
      
      let vEst = volts;
      if (typeof current === 'number' && current > 5.0) {
        vEst = Math.max(3.30, volts - (current * 0.0008));
      }

      if (vEst >= 4.08) return 100;
      if (vEst <= 3.30) return 0;

      const curve = [
        { v: 4.08, p: 100 },
        { v: 4.00, p: 90 },
        { v: 3.90, p: 80 },
        { v: 3.82, p: 60 },
        { v: 3.72, p: 40 },
        { v: 3.62, p: 20 },
        { v: 3.50, p: 10 },
        { v: 3.30, p: 0 }
      ];
      for (let i = 0; i < curve.length - 1; i++) {
        if (vEst <= curve[i].v && vEst >= curve[i+1].v) {
          const ratio = (vEst - curve[i+1].v) / (curve[i].v - curve[i+1].v);
          return Math.round(curve[i+1].p + ratio * (curve[i].p - curve[i+1].p));
        }
      }
      return 0;
    }

    const voltageEMA = {};
    const lastPacketsCount = {};
    function smoothVoltage(nodeId, rawV, pktCount) {
      if (voltageEMA[nodeId] === undefined) {
        voltageEMA[nodeId] = rawV;
        lastPacketsCount[nodeId] = pktCount;
      } else if (pktCount !== undefined && pktCount !== lastPacketsCount[nodeId]) {
        lastPacketsCount[nodeId] = pktCount;
        voltageEMA[nodeId] = voltageEMA[nodeId] * 0.75 + rawV * 0.25;
      }
      return voltageEMA[nodeId];
    }

    function getBarometricTrend(nodeId, currentP) {
      const key = `press_hist_${nodeId}`;
      const now = Date.now();
      let history = [];
      try {
        const stored = localStorage.getItem(key);
        if (stored) history = JSON.parse(stored);
      } catch(e) {}

      history.push({ t: now, p: currentP });

      const cutoff = now - (3 * 3600 * 1000);
      history = history.filter(item => item.t >= cutoff);

      try {
        localStorage.setItem(key, JSON.stringify(history));
      } catch(e) {}

      if (history.length < 2) return { arrow: '➔', label: t('press_stable'), diff: 0, hours: 0, rate: 0 };

      const oldest = history[0];
      const hours = (now - oldest.t) / (3600 * 1000);
      const diffP = currentP - oldest.p;
      const rate = hours > 0.02 ? diffP / hours : 0;

      let arrow = '➔';
      let label = t('press_stable');
      if (rate >= 0.8) { arrow = '↗'; label = t('press_rising'); }
      else if (rate <= -0.8) { arrow = '↘'; label = t('press_falling'); }

      return { arrow, label, diff: diffP, hours: Math.min(3, Math.round(hours * 10) / 10), rate };
    }

    async function resetNodeStats(nodeId) {
      if (confirm(t('confirm_reset_stats', { id: nodeId }))) {
        try {
          await fetch(`/api/reset_stats?node=${nodeId}`, { method: 'POST' });
          updateData();
        } catch (e) {
          console.error(e);
        }
      }
    }

    function initTheme() {
      const saved = localStorage.getItem('theme');
      if (saved === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        const btn = document.getElementById('theme-toggle');
        if (btn) btn.innerText = '🌙';
      } else {
        document.documentElement.removeAttribute('data-theme');
        const btn = document.getElementById('theme-toggle');
        if (btn) btn.innerText = '☀️';
      }
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      if (current === 'light') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'dark');
        const btn = document.getElementById('theme-toggle');
        if (btn) btn.innerText = '☀️';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
        const btn = document.getElementById('theme-toggle');
        if (btn) btn.innerText = '🌙';
      }
    }

    function getStationAltitude() {
      const saved = localStorage.getItem('station_altitude');
      return saved !== null ? parseFloat(saved) : 96.0;
    }

    initTheme();
    setLanguage(currentLang);
    setInterval(updateData, 1000);
  </script>
</body>
